<div id="percentage-bar">
    <span id="percentage"></span>
</div>
<div id="controls">

    <div class="ctrl-group">
        <button class="ctrl-btn" id="sortBtn">Sort</button>
    </div>

    <div class="ctrl-group">
        <button class="ctrl-btn" id="typeBtn">Type</button>
    </div>

    <div class="ctrl-group">
        <button class="ctrl-btn" id="libBtn">Status</button>
    </div>

    <div class="ctrl-group">
        <button class="ctrl-btn" id="sizeBtn">Size</button>
    </div>

    <div class="ctrl-group">
        <label class="show-title-label">
            Show Title
            <input type="checkbox" id="toggleTitle">
        </label>
    </div>

    <div class="ctrl-group ctrl-group-search">
        <div id="search-wrapper">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="search" placeholder="SEARCH..." autocomplete="off" spellcheck="false">
            <button id="search-clear" aria-label="Clear Search">&#x2715;</button>
        </div>
    </div>

</div>
